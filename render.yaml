# Render Blueprint for the backend API.
# Create via Render Dashboard -> New -> Blueprint, pointed at this repo.

services:
  - type: web
    name: agent-skills-registry-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server

    # A persistent disk is required to keep the SQLite file across deploys and
    # restarts, and Render only offers disks on paid instance types. On the free
    # plan the filesystem is ephemeral, so every redeploy or spin-down would
    # reset the registry to empty. See DESIGN.md section 32 before changing this.
    plan: starter

    healthCheckPath: /health

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: ASPNETCORE_URLS
        value: http://+:10000

      # Must sit inside the mounted disk below.
      - key: Database__Path
        value: /var/data/app.db

      # Generated once by Render and kept out of the repo. Rotating this value
      # invalidates every issued JWT, forcing all users to log in again.
      - key: Jwt__Key
        generateValue: true

      # Set to the deployed Vercel URL after the frontend exists. Until this
      # matches the browser's origin exactly, every API call fails CORS.
      - key: Cors__AllowedOrigins__0
        sync: false

    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
