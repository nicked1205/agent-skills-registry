# Render Blueprint for the backend API.
# Create via Render Dashboard -> New -> Blueprint, pointed at this repo.

services:
  - type: web
    name: agent-skills-registry-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server

    # Deliberately on the free plan, which cannot have a persistent disk. The
    # SQLite file therefore lives on the container's ephemeral filesystem and
    # the registry RESETS TO EMPTY on every redeploy and every spin-down after
    # inactivity. That is an accepted trade-off for a demo deployment.
    #
    # To make data durable, switch to a paid instance type and re-add the disk
    # block (mountPath must contain Database__Path), or move to Postgres.
    # See DESIGN.md section 32.
    plan: free

    healthCheckPath: /health

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: ASPNETCORE_URLS
        value: http://+:10000

      # Ephemeral on the free plan (no disk). If a disk is added, this path must
      # sit inside its mountPath.
      - key: Database__Path
        value: /var/data/app.db

      # Generated once by Render and kept out of the repo. Rotating this value
      # invalidates every issued JWT, forcing all users to log in again.
      - key: Jwt__Key
        generateValue: true

      # Set to the deployed Vercel URL after the frontend exists. Until this
      # matches the browser's origin exactly, every API call fails CORS.
      - key: Cors__AllowedOrigins__0
        sync: false
